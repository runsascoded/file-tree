name = "file-tree-demo"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[dev]
port = 8732

[vars]
CORS_ORIGIN = "*"

# Two prod buckets exposed read-only via MultiStore. Each is scoped to a
# safe prefix subset (matching the existing ctbk + crashes consumer
# integrations). When/if a dedicated `file-tree-demo` bucket is created
# (frozen demo fixture), add a third binding here.

[[r2_buckets]]
binding = "CTBK"
bucket_name = "ctbk"
remote = true

[[r2_buckets]]
binding = "NJ_CRASHES"
bucket_name = "nj-crashes"
remote = true

[[r2_buckets]]
binding = "DEMO"
bucket_name = "file-tree-demo"
remote = true
