<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `jq-web` self-instantiates on import, so there's no `locateFile`
         hook, and with no `document.currentScript` in a bundle emscripten
         resolves `jq.wasm` against the *page* URL — `/mock/foo/jq.wasm`,
         a different miss per route. A root `<base>` makes that one
         predictable `/jq.wasm`, which the Vite plugin serves. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@rdub/file-tree — demos</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }
      a { color: #4a90e2; }
      a:hover { text-decoration: underline; }
      pre {
        background: rgba(127, 127, 127, 0.08);
        padding: 0.6em 0.8em;
        border-radius: 4px;
        overflow: auto;
        font-size: 0.85em;
      }
      code { font-family: ui-monospace, monospace; }
      header {
        padding: 0.5em 1.5em;
        border-bottom: 1px solid rgba(127, 127, 127, 0.2);
        display: flex;
        gap: 1.5em;
        align-items: center;
      }
      header h1 { font-size: 1.1em; margin: 0; }
      header nav a { margin-right: 1em; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
