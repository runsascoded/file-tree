name: Deploy demo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Build lib (site consumes via link:..)
        run: pnpm build

      - name: Install site deps
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Build site
        run: pnpm build
        working-directory: site

      # SPA fallback: GH Pages serves 404.html for any unmatched route;
      # making it a copy of index.html lets react-router-dom resolve
      # the path client-side instead of showing the GH 404 page.
      - name: SPA fallback
        run: cp site/dist/index.html site/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
