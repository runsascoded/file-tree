name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  # `contents: write` is required so the `build-dist` reusable workflow
  # (`runsascoded/npm-dist`) can push to the `dist` branch. GH validates
  # this at workflow-load time and refuses to schedule with a startup
  # failure otherwise.
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lib
        run: pnpm build
      - name: Vitest
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck

  # Only `mock-demo` runs here: `http-demo` drives `site/worker`, whose R2
  # bindings are remote, so it needs CF credentials + live buckets. The
  # hermetic half is what catches renderer/listing regressions — e.g. a
  # new fixture silently invalidating the root entry-count assertions.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install site deps
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # The webServer command builds the lib before serving the site.
      - name: Playwright
        run: pnpm exec playwright test
        env:
          E2E_MOCK_ONLY: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build-dist:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'
    uses: runsascoded/npm-dist/.github/workflows/build-dist.yml@v1
    # Default flattening mode: npm-dist copies `dist/`'s contents to the
    # dist-branch root and rewrites the `./dist/...` paths in `exports`
    # to `./...` to match. We previously used `preserve_dirs: dist` to
    # keep paths intact, but v1's merge step transforms paths
    # unconditionally on subsequent runs, leaving exports pointing at
    # `./index.js` while files still lived under `./dist/index.js` →
    # validator failure. Default mode keeps both in sync.

  # One Worker for the demo's whole edge at `file-tree.rbw.sh`: `/v1/files/*`
  # (the R2 API), the built SPA (static assets), and per-path OG tags +
  # `/og/*` card PNGs; see `specs/done/cfw-og-images.md`.
  deploy-worker:
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lib (worker + site consume via link:)
        run: pnpm build
      # `[assets]` in `wrangler.toml` ships `site/dist`; the worker also
      # bundles the site's `MockStore` fixture for `/og/mock/*` cards.
      - name: Install site deps
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Build site
        run: pnpm build
        working-directory: site
      - name: Install worker deps
        run: pnpm install --frozen-lockfile
        working-directory: site/worker
      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: site/worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
