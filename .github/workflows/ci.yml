name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lib
        run: pnpm build
      - name: Vitest
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck

  build-pages:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lib (site consumes via link:..)
        run: pnpm build
      - name: Install site deps
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Build site
        run: pnpm build
        working-directory: site
      # SPA fallback for react-router-dom routes (`/mock`, `/http`, …)
      - name: SPA fallback
        run: cp site/dist/index.html site/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-pages:
    needs: build-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build-dist:
    needs: test
    if: github.ref == 'refs/heads/main'
    uses: runsascoded/npm-dist/.github/workflows/build-dist.yml@v1
    with:
      # tsup writes a directory tree to `dist/`; the source `package.json`
      # exports already point at `./dist/...`. `preserve_dirs: dist` keeps
      # `dist/` intact on the dist branch (no flattening), so the exports
      # work as-is without an `exports_map`.
      preserve_dirs: dist

  deploy-worker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build lib (worker consumes via link:../..)
        run: pnpm build
      - name: Install worker deps
        run: pnpm install --frozen-lockfile
        working-directory: site/worker
      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: site/worker
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
