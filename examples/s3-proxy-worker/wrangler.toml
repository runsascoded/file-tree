name = "s3-proxy"
main = "src/index.ts"
compatibility_date = "2025-04-01"

[dev]
port = 8733

[vars]
CORS_ORIGIN = "*"
# Hardcode if non-secret; otherwise use `wrangler secret put S3_REGION`.
# S3_REGION = "us-east-1"
# S3_BUCKET = "my-bucket"
# S3_PREFIXES = "data/,logs/"
# S3_ENDPOINT = "https://<account>.r2.cloudflarestorage.com"

# Secrets (set via `wrangler secret put <NAME>`):
#   S3_ACCESS_KEY_ID
#   S3_SECRET_ACCESS_KEY
# If S3_REGION / S3_BUCKET / S3_PREFIXES / S3_ENDPOINT are sensitive
# in your context, set those via `wrangler secret put` too.
